<div class="d-flex align-items-center justify-content-between mb-3">
	<div>
		<h2 class="h4 mb-0">Dashboard</h2>
		<!-- <div class="text-secondary small">Statistiques globales + carte (localisation = "lat,lng")</div> -->
	</div>
	<div class="d-flex gap-2">
		<button class="btn btn-outline-secondary" type="button" (click)="load()" [disabled]="isLoading">Rafraîchir</button>
	</div>
</div>

<div *ngIf="error" class="alert alert-danger">{{ error }}</div>

<div class="row g-3 mb-3">
	<div class="col-6 col-lg-3">
		<div class="card">
			<div class="card-body">
				<div class="text-secondary small">Exploitations</div>
				<div class="h3 mb-0">{{ stats.exploitations }}</div>
			</div>
		</div>
	</div>
	<div class="col-6 col-lg-3">
		<div class="card">
			<div class="card-body">
				<div class="text-secondary small">Parcelles</div>
				<div class="h3 mb-0">{{ stats.parcelles }}</div>
			</div>
		</div>
	</div>
	<div class="col-6 col-lg-3">
		<div class="card">
			<div class="card-body">
				<div class="text-secondary small">Capteurs</div>
				<div class="h3 mb-0">{{ stats.capteurs }}</div>
			</div>
		</div>
	</div>
	<div class="col-6 col-lg-3">
		<div class="card">
			<div class="card-body">
				<div class="text-secondary small">Météo</div>
				<div class="h3 mb-0">{{ stats.meteo }}</div>
			</div>
		</div>
	</div>
</div>

<div class="card">
	<div class="card-header d-flex align-items-center justify-content-between">
		<span>Carte</span>
		<span class="text-secondary small">Ex: localisation = <code>48.8566,2.3522</code></span>
	</div>
	<div class="card-body">
		<div id="dashboard-map" style="height: 420px;" class="border rounded"></div>
		<!-- <div class="text-secondary small mt-2">
			Les marqueurs ne s'affichent que si la localisation est au format coordonnées.
		</div> -->
	</div>
</div>
